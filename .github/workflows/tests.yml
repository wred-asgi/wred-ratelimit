name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            dependencies: minimum
          - python: "3.11"
            dependencies: latest
          - python: "3.14"
            dependencies: latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      WRED_TEST_REDIS: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Redis for isolated restart test
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Install supported minimum dependencies
        if: matrix.dependencies == 'minimum'
        run: python -m pip install -e '.[test,redis]' 'limits==4.2.0' 'redis==5.2.0'
      - name: Install latest compatible dependencies
        if: matrix.dependencies == 'latest'
        run: python -m pip install -e '.[test,redis]'
      - run: python -m pytest -q
